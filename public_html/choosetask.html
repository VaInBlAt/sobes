<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор заданий</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Стиль «неактивной» кнопки-ссылки — повторяем вид .btn:disabled из record.html */
  .btn.disabled,
  .btn.disabled:hover,
  .btn.disabled:focus-visible{
    background:var(--bg);
    color:var(--muted);
    border:1px solid var(--line);
    cursor:not-allowed;
    transform:none;
    filter:none;
    pointer-events:none;
    opacity:.75;
  }
</style>
</head>
<body>
<header class="topbar"><a href="index.html">🏠 На главную</a><span class="sp"></span><a href="varchoice.html">← Назад</a></header>
<main class="stage"><div class="card">
<h3>Выберите блок заданий</h3>
<p class="sub" id="var"></p>
<a class="btn" id="t12" href="record.html">Задания 1–2</a>
<a class="btn alt disabled" id="t3" href="#" aria-disabled="true">Задание 3 (в разработке)</a>
</div></main>
<script>
var v = new URLSearchParams(location.search).get('v');
if (v) {
  document.getElementById('var').textContent = 'Вариант ' + v;
  document.getElementById('t12').href = 'record.html?v=' + v;
}
</script>
</body></html>
