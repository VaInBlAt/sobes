<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Список вариантов</title>
<link rel="stylesheet" href="style.css">
<style>
  .vargrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    list-style:none;
    margin:0;
    padding:0;
  }
  .vargrid li{margin:0}
  .vargrid a{display:block;text-align:center}
  @media (max-width:700px){
    .vargrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header class="topbar"><a href="index.html">🏠 На главную</a><span class="sp"></span><a href="varchoice.html">← Назад</a></header>
<main class="stage"><div class="card">
<h2>Варианты итогового собеседования</h2>
<ul class="list vargrid" id="variants"></ul>
</div></main>
<script>
// Адрес сервера Flask — тот же приём, что и на record.html
var API = (location.port === '5000') ? '' : 'http://127.0.0.1:5000';
var list = document.getElementById('variants');

fetch(API + '/variants')
  .then(function (r) { return r.json(); })
  .then(function (items) {
    if (!Array.isArray(items)) throw new Error('некорректный ответ сервера');
    list.innerHTML = items.map(function (v) {
      return '<li><a href="choosetask.html?v=' + v.id + '">Вариант ' + v.id + '</a></li>';
    }).join('');
  })
  .catch(function (e) {
    list.innerHTML = '<li>Не удалось загрузить варианты: ' + e.message +
      '. Откройте страницу через http://127.0.0.1:5000/numofvar.html</li>';
  });
</script>
</body></html>
